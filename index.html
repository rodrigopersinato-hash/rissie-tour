<style>
/* Layout: player de cinema em tela escura; quadro 16:9 no centro, pontos clicáveis sobre a cena, escolhas que sobem no fim de cada episódio */
:root{
  --bg:#070707; --panel:#141414; --ink:#F5F1EE; --muted:#9C9592; --line:rgba(255,255,255,.12);
  --accent:#E2557A; --gold:#F2C66D;
  --f-disp:"Sora", "Avenir Next", system-ui, sans-serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;font-size:20px;color:var(--accent)}
.brand small{color:var(--muted);font-weight:300;letter-spacing:.04em;font-size:13px;margin-left:10px}
.topbtns{display:flex;gap:6px;flex-wrap:wrap}
.tb{padding:8px 14px;border-radius:6px;font-size:13px;color:var(--muted)}
.tb:hover,.tb[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.08)}

.screen{position:relative;width:100%;aspect-ratio:16/9;max-height:78vh;border-radius:10px;overflow:hidden;background:#000;isolation:isolate}
.scene-bg{position:absolute;inset:0;transition:background 1s ease}
.scene-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.85),transparent 60%),linear-gradient(180deg,rgba(0,0,0,.55),transparent 22%,transparent 70%,rgba(0,0,0,.8))}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,transparent 1px 3px);mix-blend-mode:overlay}

.ep{position:absolute;left:4%;top:5%;z-index:3;max-width:70%}
.ep .n{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:500}
.ep h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(28px,5.4vw,68px);line-height:1;margin:.15em 0 0;letter-spacing:-.02em;text-wrap:balance}
.ep p{transition:opacity .8s;margin:.6em 0 0;font-size:clamp(13px,1.5vw,18px);color:rgba(245,241,238,.82);max-width:46ch}

.shot{position:absolute;inset:auto 4% 16% auto;z-index:3;width:min(330px,40%);padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px dashed rgba(255,255,255,.28);font-size:13px}
.shot b{display:block;font-family:var(--f-disp);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.shot label{display:inline-block;margin-top:10px;font-size:12px;color:var(--ink);border-bottom:1px solid var(--ink);cursor:pointer}
.shot input{position:absolute;opacity:0;width:1px;height:1px}

.hs{position:absolute;z-index:4;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;display:grid;place-items:center}
.hs::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff;animation:ping 2.2s ease-out infinite}
.hs::after{content:"";width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(226,85,122,.55)}
.hs:hover::after,.hs.open::after{background:var(--accent);box-shadow:0 0 0 6px rgba(255,255,255,.35)}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.hidehs .hs{display:none}
.tip{position:absolute;z-index:5;width:min(280px,60%);padding:14px 16px;border-radius:10px;background:rgba(18,18,18,.92);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:14px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.tip h3{margin:0 0 4px;font-family:var(--f-disp);font-size:15px;font-weight:500}
.tip p{margin:0;color:rgba(245,241,238,.8)}

.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 4% 2.4%;display:flex;flex-direction:column;gap:10px}
.bar{height:4px;background:rgba(255,255,255,.22);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.row{display:flex;align-items:center;gap:14px;font-size:13px;color:rgba(245,241,238,.85)}
.row .sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.ib:hover{background:rgba(255,255,255,.22)}
.ib svg{width:18px;height:18px}
.skip{padding:8px 14px;border-radius:6px;background:rgba(255,255,255,.12);font-size:13px}

.choices{position:absolute;inset:auto 0 0 0;z-index:7;padding:6% 4% 3.2%;background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,.75) 60%,transparent);transform:translateY(100%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.choices.on{transform:none}
.choices .q{font-family:var(--f-disp);font-weight:300;font-size:clamp(16px,2vw,24px);margin:0 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{position:relative;text-align:left;padding:18px 18px 16px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .2s,background .2s;min-height:88px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.opt:hover{transform:translateY(-3px);background:rgba(255,255,255,.14)}
.opt .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.opt .t{font-family:var(--f-disp);font-weight:500;font-size:clamp(15px,1.6vw,20px);line-height:1.2;margin-top:4px}
.opt .sw{position:absolute;inset:0 0 auto 0;height:4px}
.timer{height:3px;margin-top:14px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:#fff;transform-origin:left}

.below{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.trail{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.chip.seen{color:var(--ink);border-color:rgba(255,255,255,.3)}
.chip.cur{background:var(--ink);color:#000;border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}

.drawer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;justify-content:flex-end}
.drawer .in{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--panel);padding:24px 22px 40px;display:flex;flex-direction:column;gap:14px}
.drawer h2{font-family:var(--f-disp);font-weight:500;margin:0;font-size:22px}
.drawer .x{align-self:flex-end;padding:6px 10px;color:var(--muted)}
.card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:12px;border-radius:8px;border:1px solid var(--line);text-align:left;width:100%}
.card:hover{background:rgba(255,255,255,.05)}
.thumb{aspect-ratio:16/10;border-radius:5px}
.card .t{font-family:var(--f-disp);font-size:15px;font-weight:500}
.card .d{font-size:13px;color:var(--muted)}
.card .who{font-size:12px;color:var(--gold);margin-top:4px}
.screen.fs,.screen:fullscreen{position:fixed;inset:0;z-index:50;width:100vw;height:100vh;height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0}
.screen:fullscreen{position:relative}
.screen.fs .choices,.screen:fullscreen .choices{position:absolute;transform:translateY(100%);display:block;background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,.75) 60%,transparent);padding:6% 4% 3.2%}
.screen.fs .choices.on,.screen:fullscreen .choices.on{transform:none}
body.fsl{overflow:hidden}
.start{position:absolute;inset:0;z-index:12;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(58,22,34,.55),rgba(0,0,0,.9) 75%);text-align:center;padding:16px}
.st-k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.st-t{font-family:var(--f-disp);font-weight:700;font-size:clamp(30px,6vw,72px);line-height:1;margin-top:.2em;letter-spacing:-.02em}
.st-s{color:rgba(245,241,238,.75);margin-top:.7em;font-size:clamp(13px,1.6vw,17px)}
.st-b{margin-top:1.4em;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#000;border-radius:999px;padding:14px 28px;font-weight:500;font-size:16px}
.st-b:hover{background:#fff}
@media (max-width:700px){
 .choices{position:static;transform:none;display:none;background:none;padding:14px 0 0}
 .choices.on{display:block}
 .ep h1{font-size:26px}.ep .n{font-size:10px}
 .ctrl{padding-bottom:6px}.row{gap:8px;font-size:12px}.ib{width:32px;height:32px}.skip{padding:6px 10px;font-size:12px}
 .hs{width:28px;height:28px;margin:-14px 0 0 -14px}
 .tip{width:min(240px,80%);font-size:13px}
 .opt{min-height:64px;padding:14px}
}
@media (max-width:640px){.shot{display:none}.ep p{display:none}}
@media (prefers-reduced-motion:reduce){.hs::before{animation:none}.choices{transition:none}}
</style>

function load(id){
  cur=id; t=0; phase="play"; ct=0; seen.add(id); playing=true; setIcon();
  const s=SC[id];
  $("sbg").style.background=grad(s.c);
  $("epN").textContent=s.n; $("epT").textContent=s.t; $("epS").textContent=s.s;
  $("shotTxt").textContent=s.shot; $("tip").hidden=true;
  const src=custom[id]||VID[id];
  if(src){vid.src=src;vid.hidden=false;$("shot").hidden=true;vid.currentTime=0;
    vid.muted=true;vid.loop=false;
    rate=Math.max(0.6,Math.min(1,8/((NAR[id]||8)+0.6)));
    vid.defaultPlaybackRate=rate;vid.playbackRate=rate;
    vid.onloadedmetadata=()=>{vid.playbackRate=rate};
    vid.play().catch(()=>{})}
  if(started){nar.src="narr/"+id+".mp3";nar.currentTime=0;nar.muted=!soundOn;nar.play().catch(()=>{});duck(true)}
  else{vid.hidden=true;vid.removeAttribute("src");$("shot").hidden=false}
  const L=$("hsLayer"); L.innerHTML="";
  s.hs.forEach((h,i)=>{const b=document.createElement("button");b.className="hs";b.style.left=h.x+"%";b.style.top=h.y+"%";b.setAttribute("aria-label",h.h);
    b.onclick=e=>{e.stopPropagation();openTip(h,b)};L.appendChild(b)});
  $("ch").classList.remove("on");
  $("chQ").textContent=s.q;
  $("opts").innerHTML="";
  s.o.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="sw" style="background:${SC[o.to].c[0]}"></span><span class="k"></span><span class="t"></span>`;
    b.querySelector(".k").textContent=o.k;b.querySelector(".t").textContent=o.t;b.onclick=()=>load(o.to);$("opts").appendChild(b)});
  trail();
}
function openTip(h,b){
  const tip=$("tip");document.querySelectorAll(".hs").forEach(x=>x.classList.remove("open"));b.classList.add("open");
  $("tipH").textContent=h.h;$("tipP").textContent=h.p;tip.hidden=false;
  const W=$("screen").clientWidth,H=$("screen").clientHeight;
  let x=h.x/100*W+24,y=h.y/100*H-20; if(x+290>W)x=h.x/100*W-24-Math.min(280,W*.6);
  tip.style.left=Math.max(8,x)+"px";tip.style.top=Math.max(8,Math.min(y,H-160))+"px";
}
$("screen").addEventListener("click",e=>{if(!e.target.closest(".tip,.hs,.ctrl,.choices,.shot")){$("tip").hidden=true;document.querySelectorAll(".hs").forEach(x=>x.classList.remove("open"))}});
function dur(){return started&&NAR[cur]?Math.max(8,NAR[cur]+0.8):(!vid.hidden&&vid.duration?vid.duration:DUR)}
function showChoices(){phase="choice";ct=0;$("ch").classList.add("on")}
function trail(){
  const T=$("trail");T.innerHTML="";
  ORDER.forEach(id=>{const b=document.createElement("button");b.className="chip"+(seen.has(id)?" seen":"")+(id===cur?" cur":"");b.textContent=SC[id].t;b.onclick=()=>load(id);T.appendChild(b)});
}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function setIcon(){$("icoPlay").innerHTML=playing?'<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>':'<path d="M7 5l12 7-12 7z"/>';$("bPlay").setAttribute("aria-label",playing?"Pausar":"Tocar")}
$("bPlay").onclick=()=>{playing=!playing;setIcon();if(soundOn){playing?mus.play().catch(()=>{}):mus.pause()}if(playing){if(nar.src&&!nar.ended)nar.play().catch(()=>{})}else nar.pause();if(!vid.hidden){playing?vid.play().catch(()=>{}):vid.pause()}};
$("bSkip").onclick=()=>{t=dur();nar.pause();duck(false);showChoices()};
$("bHs").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);$("screen").classList.toggle("hidehs",!on);$("tip").hidden=true};
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;custom[cur]=URL.createObjectURL(f);load(cur)};
const nar=$("nar");
const NAR={abertura:12.8,chegada:10.4,defeito:7.5,estoque:13.1,loja:7.0,montagem:12.5,encomenda:10.7,saida:8.9,rua:8.1,acerto:9.4,embalagem:7.8,fim:8.3};
let rate=1;
function duck(on){const target=on?0.18:0.6;const m=$("mus");const step=()=>{const d=target-m.volume;if(Math.abs(d)<0.02){m.volume=target;return}m.volume=Math.max(0,Math.min(1,m.volume+Math.sign(d)*0.03));setTimeout(step,40)};step()}
nar.onended=()=>duck(false);

let last=performance.now();
function loop(now){
  const dt=(now-last)/1000;last=now;
  if(playing){
    if(phase==="play"){
      t+=dt;
      if(t>=dur()){showChoices();duck(false)}
    }else if(phase==="choice"){
      ct+=dt; if(ct>=CHOICE){load(SC[cur].o[0].to)}
    }
  }
  const D=dur();
  $("prog").style.width=Math.min(100,t/D*100)+"%";
  $("tc").textContent=fmt(t)+" / "+fmt(D);
  $("tmr").style.transform=`scaleX(${phase==="choice"?Math.max(0,1-ct/CHOICE):1})`;
  requestAnimationFrame(loop);
}

function openDrawer(kind){
  const d=$("dIn");d.innerHTML="";
  const x=document.createElement("button");x.className="x";x.textContent="Fechar";x.onclick=()=>$("drawer").hidden=true;d.appendChild(x);
  const h=document.createElement("h2");h.textContent=kind==="eps"?"Episódios":"Roteiro de gravação";d.appendChild(h);
  if(kind==="shot"){const p=document.createElement("p");p.className="hint";p.style.margin="0";p.textContent="Grave com o celular na horizontal, cenas de 15 a 40 segundos, sem fala. Me mande os vídeos e eu coloco cada um no seu episódio.";d.appendChild(p)}
  ORDER.forEach(id=>{const s=SC[id];const c=document.createElement("button");c.className="card";
    c.innerHTML=`<span class="thumb" style="background:${grad(s.c)}"></span><span><div class="t"></div><div class="d"></div><div class="who"></div></span>`;
    c.querySelector(".t").textContent=s.n+" · "+s.t;c.querySelector(".d").textContent=kind==="eps"?s.s:s.shot;c.querySelector(".who").textContent=kind==="eps"?(seen.has(id)?"Assistido":""):s.who;
    c.onclick=()=>{$("drawer").hidden=true;load(id)};d.appendChild(c)});
  $("drawer").hidden=false;
}
$("bEps").onclick=()=>openDrawer("eps");

$("drawer").onclick=e=>{if(e.target.id==="drawer")$("drawer").hidden=true};

if(matchMedia("(max-width:700px)").matches){$("screen").after($("ch"))}
const mus=$("mus"); mus.volume=0.6;
function applySound(){mus.muted=!soundOn;nar.muted=!soundOn;$("bSnd").setAttribute("aria-pressed",soundOn);$("bSnd").textContent=soundOn?"Som":"Sem som"}
$("bSnd").onclick=()=>{soundOn=!soundOn;applySound();if(soundOn&&started)mus.play().catch(()=>{})};
$("bStart").onclick=()=>{started=true;$("start").hidden=true;mus.currentTime=0;mus.play().catch(()=>{});load("abertura")};

const scr=$("screen"), isMobile=()=>matchMedia("(max-width:700px)").matches;
function placeChoices(fs){ if(fs){scr.appendChild($("ch"))} else if(isMobile()){scr.after($("ch"))} }
function enterFs(){
  placeChoices(true);
  if(scr.requestFullscreen){scr.requestFullscreen().then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch(e){}}).catch(()=>{scr.classList.add("fs");document.body.classList.add("fsl")})}
  else if(scr.webkitRequestFullscreen){scr.webkitRequestFullscreen()}
  else{scr.classList.add("fs");document.body.classList.add("fsl")}
}
function exitFs(){
  if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}
  else if(document.webkitFullscreenElement){document.webkitExitFullscreen()}
  scr.classList.remove("fs");document.body.classList.remove("fsl");placeChoices(false);
}
const inFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||scr.classList.contains("fs"));
$("bFs").onclick=e=>{e.stopPropagation();inFs()?exitFs():enterFs()};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement){scr.classList.remove("fs");placeChoices(false)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&scr.classList.contains("fs"))exitFs()});
load("abertura"); playing=false; setIcon(); vid.pause();
if(matchMedia("(prefers-reduced-motion: reduce)").matches){playing=false;setIcon()}
requestAnimationFrame(loop);
</script>

</body>
</html>
